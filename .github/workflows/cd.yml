# Déploiement continu — voir docs/01-protocole-deploiement-continu.md
# Déclenché par le push d'un tag SemVer (vX.Y.Z) sur main.
name: CD

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # création de la GitHub Release
  packages: write # push de l'image sur ghcr.io

jobs:
  # 1. Exécution complète de la CI avant tout déploiement
  ci:
    uses: ./.github/workflows/ci.yml

  # 2. API : image Docker → ghcr.io + GitHub Release avec le CHANGELOG
  deploy-api:
    name: API — image Docker + GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Métadonnées de l'image (tags latest + version)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/soundproof-api
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build et push de l'image (multi-stage)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extraction de la section du CHANGELOG pour cette version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Version ${GITHUB_REF_NAME} (voir CHANGELOG.md)" > release-notes.md
          fi

      - name: Création de la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md

  # 3. Mobile : build EAS (APK preview) attaché à la Release
  build-mobile:
    name: Mobile — build EAS et APK attaché à la Release
    needs: [ci, deploy-api]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js 20 + cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: EAS CLI (authentifié par EXPO_TOKEN)
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Installation reproductible
        run: npm ci

      - name: Build EAS Android (profil preview → APK)
        run: eas build --platform android --profile preview --non-interactive --json > build.json

      - name: Téléchargement de l'APK produit
        run: |
          APK_URL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build.json','utf8'))[0].artifacts.buildUrl)")
          curl -L --fail -o "soundproof-${GITHUB_REF_NAME}.apk" "$APK_URL"

      - name: Attachement de l'APK à la GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "soundproof-${GITHUB_REF_NAME}.apk" --clobber
